# Tiny Tapeout project information
project:
  title:        "Tic Tac Toe Game"      # Project title
  author:       "Joaquin Guzman"      # Your name
  discord:      "morningburn"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "It is a simple Tic Tac Toe game"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_Jo1673"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "hvsync_generator.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "square_select_0"
  ui[1]: "square_select_1"
  ui[2]: "square_select_2"
  ui[3]: "square_select_3"
  ui[4]: "submit_move"
  ui[5]: "game_reset"
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "hsync"
  uo[1]: "vsync"
  uo[2]: "red"
  uo[3]: "green"
  uo[4]: "blue"
  uo[5]: "x_win"
  uo[6]: "o_win"
  uo[7]: "draw"

  # Bidirectional pins
  uio[0]: "current_turn"
  uio[1]: "game_over"
  uio[2]: "valid_square"
  uio[3]: "selected_square_empty"
  uio[4]: "submit_synced"
  uio[5]: "x_win_debug"
  uio[6]: "o_win_debug"
  uio[7]: "draw_debug"

# Do not change!
yaml_version: 6
